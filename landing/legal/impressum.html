<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impressum — 15minYoga</title>
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://15minyoga.com/legal/impressum" />
  <link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .legal { max-width: 760px; margin: 0 auto; padding: 40px 22px 90px; }
    .legal__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 34px; }
    .legal__back { display: inline-flex; align-items: center; gap: 8px; color: var(--olive); font-size: 15px; }
    .legal__back:hover { color: var(--clay-deep); }
    .legal__back img { height: 26px; width: auto; }
    .legal h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 42px); font-weight: 600; margin: 0 0 6px; }
    .legal__intro { color: var(--olive); margin: 0 0 34px; font-size: 15px; }
    .legal section { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
    .legal section:last-of-type { border-bottom: 0; }
    .legal h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 12px; }
    .legal p { margin: 0 0 9px; color: var(--ink-soft); font-size: 15.5px; line-height: 1.6; }
    .legal p:last-child { margin-bottom: 0; }
    .legal .addr p { color: var(--ink); margin-bottom: 2px; }
    .legal a { color: var(--clay-deep); }
    .legal__foot { margin-top: 40px; font-size: 14px; color: var(--olive); }
  </style>
</head>

<body>
  <main class="legal">
    <div class="legal__top">
      <a class="legal__back" href="../index.html">
        <img src="../assets/brand/logo-horizontal.svg" alt="15minYoga" />
      </a>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button class="lang__btn" data-lang="de" type="button">DE</button>
        <button class="lang__btn" data-lang="ru" type="button">RU</button>
        <button class="lang__btn" data-lang="en" type="button">EN</button>
        <button class="lang__btn" data-lang="uk" type="button">UK</button>
      </div>
    </div>

    <h1 id="imTitle">Impressum</h1>
    <p class="legal__intro" id="imIntro">Angaben gemäß § 5 DDG</p>
    <div id="imBody"><!-- rendered from js/impressum.js --></div>

    <p class="legal__foot"><a href="../index.html">← 15minyoga.com</a></p>
  </main>

  <script src="../js/impressum.js"></script>
  <script>
    (function () {
      var DATA = window.NIGUMA_IMPRESSUM || {};
      var SUPPORTED = ["de", "ru", "en", "uk"];
      var KEY = "niguma.lang";

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      // turn bare URLs and e-mails into links
      function linkify(s) {
        return esc(s)
          .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');
      }

      function render(lang) {
        var d = DATA[lang] || DATA.de;
        if (!d) return;
        document.documentElement.lang = lang;
        document.title = d.title + " — 15minYoga";
        document.getElementById("imTitle").textContent = d.title;
        document.getElementById("imIntro").textContent = d.intro;
        document.getElementById("imBody").innerHTML = d.sections.map(function (sec) {
          // address-style blocks (short lines) get tighter spacing
          var isAddr = sec.lines.every(function (l) { return l.length < 60; });
          return '<section' + (isAddr ? ' class="addr"' : '') + '>' +
            "<h2>" + esc(sec.heading) + "</h2>" +
            sec.lines.map(function (l) { return "<p>" + linkify(l) + "</p>"; }).join("") +
            "</section>";
        }).join("");
        document.querySelectorAll(".lang__btn").forEach(function (b) {
          b.setAttribute("aria-current", String(b.getAttribute("data-lang") === lang));
        });
        try { localStorage.setItem(KEY, lang); } catch (e) { }
      }

      function detect() {
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) { }
        if (saved && SUPPORTED.indexOf(saved) >= 0) return saved;
        var nav = (navigator.language || "de").slice(0, 2).toLowerCase();
        return SUPPORTED.indexOf(nav) >= 0 ? nav : "de";
      }

      document.addEventListener("DOMContentLoaded", function () {
        render(detect());
        document.querySelectorAll(".lang__btn").forEach(function (b) {
          b.addEventListener("click", function () { render(b.getAttribute("data-lang")); });
        });
      });
    })();
  </script>
</body>

</html>
