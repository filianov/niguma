<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Публічний договір (оферта) — 15minYoga</title>
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://15minyoga.com/legal/terms" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css?v=20260729" />
  <style>
    .legal { max-width: 760px; margin: 0 auto; padding: 40px 22px 90px; }
    .legal__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 34px; }
    .legal__back img { height: 26px; width: auto; }
    .legal h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); font-weight: 600; margin: 0 0 6px; }
    .legal__intro { color: var(--olive); margin: 0 0 4px; font-size: 15px; }
    .legal__updated { color: var(--olive); margin: 0 0 34px; font-size: 14px; opacity: .8; }
    .legal section { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .legal section:last-of-type { border-bottom: 0; }
    .legal h2 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0 0 10px; }
    .legal p { margin: 0 0 9px; color: var(--ink-soft); font-size: 15.5px; line-height: 1.6; }
    .legal .addr p { color: var(--ink); margin-bottom: 3px; }
    .legal a { color: var(--clay-deep); }
    .legal__foot { margin-top: 40px; font-size: 14px; color: var(--olive); display: flex; gap: 18px; flex-wrap: wrap; }
  </style>
</head>

<body>
  <main class="legal">
    <div class="legal__top">
      <a class="legal__back" href="/"><img src="/assets/brand/logo-horizontal.svg" alt="15minYoga" /></a>
      <div class="lang" role="group" aria-label="Мова / Language">
        <button class="lang__btn" data-lang="uk" type="button">UK</button>
        <button class="lang__btn" data-lang="ru" type="button">RU</button>
        <button class="lang__btn" data-lang="en" type="button">EN</button>
        <button class="lang__btn" data-lang="de" type="button">DE</button>
      </div>
    </div>

    <h1 id="dTitle">Публічний договір (оферта)</h1>
    <p class="legal__intro" id="dIntro">Договір про надання послуг доступу до онлайн-занять 15minYoga</p>
    <p class="legal__updated" id="dUpdated"></p>
    <div id="dBody"></div>

    <p class="legal__foot">
      <a href="/">← 15minyoga.com</a>
      <a href="/legal/terms">Оферта</a>
      <a href="/legal/refund">Повернення</a>
      <a href="/legal/privacy">Конфіденційність</a>
      <a href="/legal/impressum">Impressum</a>
    </p>
  </main>

  <script src="/js/legal-docs.js?v=20260729"></script>
  <script>
    (function () {
      var DOCS = window.NIGUMA_LEGAL || {};
      var DOC = "terms";
      var SUPPORTED = ["uk", "ru", "en", "de"];
      var KEY = "niguma.lang";

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function linkify(s) {
        return esc(s)
          .replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/([\w.+-]+@[\w-]+\.[\w.]*\w)/g, '<a href="mailto:$1">$1</a>');
      }

      function render(lang) {
        var d = (DOCS[DOC] || {})[lang] || (DOCS[DOC] || {}).uk;
        var m = (DOCS.merchant || {})[lang] || (DOCS.merchant || {}).uk;
        if (!d) return;
        document.documentElement.lang = lang;
        document.title = d.title + " — 15minYoga";
        document.getElementById("dTitle").textContent = d.title;
        document.getElementById("dIntro").textContent = d.intro;
        document.getElementById("dUpdated").textContent = d.updated || "";
        document.getElementById("dBody").innerHTML = d.sections.map(function (sec) {
          // блок с реквизитами собирается из общего источника: он должен
          // совпадать с кабинетом мерчанта, поэтому не дублируется в текстах
          var body = sec.merchant && m
            ? [m.name, m.code, m.address, m.bank, m.email, m.site]
                .filter(Boolean).map(function (l) { return "<p>" + linkify(l) + "</p>"; }).join("")
            : (sec.lines || []).map(function (l) { return "<p>" + linkify(l) + "</p>"; }).join("");
          return "<section" + (sec.merchant ? ' class="addr"' : "") + ">" +
            "<h2>" + esc(sec.heading) + "</h2>" + body + "</section>";
        }).join("");
        document.querySelectorAll(".lang__btn").forEach(function (b) {
          b.setAttribute("aria-current", String(b.getAttribute("data-lang") === lang));
        });
        try { localStorage.setItem(KEY, lang); } catch (e) {}
      }

      function detect() {
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) {}
        if (saved && SUPPORTED.indexOf(saved) >= 0) return saved;
        var nav = (navigator.language || "uk").slice(0, 2).toLowerCase();
        return SUPPORTED.indexOf(nav) >= 0 ? nav : "uk";
      }

      document.addEventListener("DOMContentLoaded", function () {
        render(detect());
        document.querySelectorAll(".lang__btn").forEach(function (b) {
          b.addEventListener("click", function () { render(b.getAttribute("data-lang")); });
        });
      });
    })();
  </script>
</body>

</html>
