<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Datenschutzerklärung — 15minYoga</title>
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://15minyoga.com/legal/privacy" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" />
  <link rel="stylesheet" href="/css/styles.css?v=20260730" />
  <style>
    .legal { max-width: 760px; margin: 0 auto; padding: 40px 22px 90px; }
    .legal__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 34px; }
    .legal__back { display: inline-flex; align-items: center; gap: 8px; color: var(--olive); font-size: 15px; }
    .legal__back:hover { color: var(--clay-deep); }
    .legal__back img { height: 26px; width: auto; }
    .legal h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 42px); font-weight: 600; margin: 0 0 6px; }
    .legal__intro { color: var(--olive); margin: 0 0 4px; font-size: 15px; }
    .legal__updated { color: var(--olive); margin: 0 0 34px; font-size: 14px; opacity: .8; }
    .legal section { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
    .legal section:last-of-type { border-bottom: 0; }
    .legal h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 12px; }
    .legal p { margin: 0 0 9px; color: var(--ink-soft); font-size: 15.5px; line-height: 1.6; }
    .legal p:last-child { margin-bottom: 0; }
    .legal .addr p { color: var(--ink); margin-bottom: 2px; }
    .legal a { color: var(--clay-deep); }
    .legal__foot { margin-top: 40px; font-size: 14px; color: var(--olive); display: flex; gap: 18px; flex-wrap: wrap; }
  </style>
</head>

<body>
  <main class="legal">
    <div class="legal__top">
      <a class="legal__back" href="/">
        <img src="/assets/brand/logo-horizontal.svg" alt="15minYoga" />
      </a>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button class="lang__btn" data-lang="de" type="button">DE</button>
        <button class="lang__btn" data-lang="ru" type="button">RU</button>
        <button class="lang__btn" data-lang="en" type="button">EN</button>
        <button class="lang__btn" data-lang="uk" type="button">UK</button>
      </div>
    </div>

    <h1 id="pvTitle">Datenschutzerklärung</h1>
    <p class="legal__intro" id="pvIntro">Informationen gemäß Art. 13 und 14 DSGVO</p>
    <p class="legal__updated" id="pvUpdated"></p>
    <div id="pvBody"><!-- rendered from js/privacy.js --></div>

    <p class="legal__foot">
      <a href="/" id="pvBack">← 15minyoga.com</a>
      <a href="/legal/terms">Оферта</a>
      <a href="/legal/refund">Повернення</a>
      <a href="/legal/impressum" id="pvImprint">Impressum</a>
    </p>
  </main>

  <script src="/js/privacy.js?v=20260730"></script>
  <script src="/js/legal-lang.js?v=20260730"></script>
  <script>
    (function () {
      var DATA = window.NIGUMA_PRIVACY || {};

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      // голые ссылки и адреса почты делаем кликабельными
      function linkify(s) {
        // хвостовые знаки препинания в адрес не включаем:
        // без этого «...@gmail.com.» в конце предложения даёт ссылку с точкой
        return esc(s)
          .replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/([\w.+-]+@[\w-]+\.[\w.]*\w)/g, '<a href="mailto:$1">$1</a>');
      }

      function render(lang) {
        var d = DATA[lang] || DATA.de;
        if (!d) return;
        document.documentElement.lang = lang;
        document.title = d.title + " — 15minYoga";
        document.getElementById("pvTitle").textContent = d.title;
        document.getElementById("pvIntro").textContent = d.intro;
        document.getElementById("pvUpdated").textContent = d.updated || "";
        document.getElementById("pvBack").textContent = "← " + (d.back || "15minyoga.com");
        document.getElementById("pvImprint").textContent = d.imprint || "Impressum";
        document.getElementById("pvBody").innerHTML = d.sections.map(function (sec) {
          // блоки-реквизиты (короткие строки) верстаем плотнее
          var isAddr = sec.lines.every(function (l) { return l.length < 60; });
          return '<section' + (isAddr ? ' class="addr"' : '') + '>' +
            "<h2>" + esc(sec.heading) + "</h2>" +
            sec.lines.map(function (l) { return "<p>" + linkify(l) + "</p>"; }).join("") +
            "</section>";
        }).join("");
        document.querySelectorAll(".lang__btn").forEach(function (b) {
          b.setAttribute("aria-current", String(b.getAttribute("data-lang") === lang));
        });
      }


      document.addEventListener("DOMContentLoaded", function () {
        window.NigumaLegalLang(render, "uk");
      });
    })();
  </script>
</body>

</html>
