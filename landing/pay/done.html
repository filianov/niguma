<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата — 15minYoga</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css?v=20260730" />
  <style>
    .done { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .done__box { max-width: 460px; }
    .done__tick { width: 66px; height: 66px; margin: 0 auto 20px; border-radius: 50%;
      background: var(--olive); color: var(--paper); display: grid; place-items: center; font-size: 32px; }
    .done h1 { font-family: var(--font-display); font-size: 28px; margin: 0 0 10px; }
    .done p { color: var(--ink-soft); margin: 0 0 22px; }
  </style>
</head>

<body>
  <main class="done">
    <div class="done__box">
      <div class="done__tick">✓</div>
      <h1 id="title">Спасибо за оплату</h1>
      <p id="body">Доступ откроется автоматически. Если что-то пойдёт не так, мы напишем вам —
        а вы всегда можете спросить нас в Telegram.</p>
      <a class="btn btn--primary" href="/">На главную</a>
    </div>
  </main>

  <script>
    /* Страница только сообщает результат. Оплату подтверждает не она, а ответ
       LiqPay на /api/liqpay-callback: адресную строку может открыть кто угодно,
       поэтому доверять ей нельзя. */
    (function () {
      var T = {
        ru: { t: "Спасибо за оплату", b: "Доступ откроется автоматически. Если что-то пойдёт не так, мы напишем вам — а вы всегда можете спросить нас в Telegram.", home: "На главную" },
        en: { t: "Thank you for your payment", b: "Your access will open automatically. If anything goes wrong we will contact you — and you can always ask us on Telegram.", home: "Back to the homepage" },
        de: { t: "Danke für Ihre Zahlung", b: "Der Zugang wird automatisch freigeschaltet. Falls etwas nicht klappt, melden wir uns — und Sie können uns jederzeit auf Telegram fragen.", home: "Zur Startseite" },
        uk: { t: "Дякуємо за оплату", b: "Доступ відкриється автоматично. Якщо щось піде не так, ми напишемо вам — а ви завжди можете запитати нас у Telegram.", home: "На головну" }
      };
      var saved = null;
      try { saved = localStorage.getItem("niguma.lang"); } catch (e) {}
      var l = T[saved] || T[(navigator.language || "ru").slice(0, 2)] || T.ru;
      document.getElementById("title").textContent = l.t;
      document.getElementById("body").textContent = l.b;
      document.querySelector(".btn").textContent = l.home;
    })();
  </script>
</body>

</html>
