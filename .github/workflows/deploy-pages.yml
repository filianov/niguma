name: Deploy landing to GitHub Pages

# Публикует папку landing/ на GitHub Pages при каждом пуше в main.
# Включить один раз: репозиторий → Settings → Pages → Source: "GitHub Actions".
# (Для бесплатного аккаунта репозиторий должен быть Public.)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing            # публикуем только лендинг
      - id: deployment
        uses: actions/deploy-pages@v4
